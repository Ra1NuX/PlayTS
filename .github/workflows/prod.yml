name: Publish Prod

on:
  pull_request:
    branches:
      - main
jobs:
  build-prod-windows:
    environment: production
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Sincronizar cambios antes de leer package.json
        run: |
          git pull --rebase origin main

      - name: Instalar dependencias
        run: bun install

      - name: Build & Publish Prod (Windows)
        run: |
          bun run build && bunx electron-builder --config electron-builder.config.js -w --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
  build-prod-linux:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Sincronizar cambios antes de leer package.json
        run: |
          git pull --rebase origin main

      - name: Install dependencies
        run: bun install

      - name: Build & Publish Prod (Linux)
        run: |
          bun run build && bunx electron-builder --config electron-builder.config.js -l --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
  build-prod-mac:
    environment: production
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Sincronizar cambios antes de leer package.json
        run: |
          git pull --rebase origin main

      - name: Install dependencies
        run: bun install

      - name: Build & Publish Prod (Mac)
        run: |
          bun run build && bunx electron-builder --config electron-builder.config.js -m --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
